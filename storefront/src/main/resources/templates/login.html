<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Вход — My Market</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #f5f5f5;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .card {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 2px 16px rgba(0,0,0,0.1);
            padding: 2.5rem 2rem;
            width: 100%;
            max-width: 380px;
        }
        h1 { font-size: 1.5rem; margin-bottom: 1.5rem; text-align: center; color: #1a1a1a; }
        .error {
            background: #fef2f2;
            border: 1px solid #fca5a5;
            color: #b91c1c;
            border-radius: 6px;
            padding: 0.75rem 1rem;
            margin-bottom: 1rem;
            font-size: 0.9rem;
        }
        label { display: block; font-size: 0.875rem; color: #555; margin-bottom: 0.3rem; }
        input[type=text], input[type=password] {
            width: 100%;
            padding: 0.6rem 0.75rem;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 1rem;
            margin-bottom: 1rem;
            outline: none;
        }
        input:focus { border-color: #6366f1; }
        button {
            width: 100%;
            padding: 0.7rem;
            background: #6366f1;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
        }
        button:hover { background: #4f46e5; }
        .hint { text-align: center; margin-top: 1rem; font-size: 0.8rem; color: #888; }
    </style>
</head>
<body>
<div class="card">
    <h1>Вход в магазин</h1>

    <div class="error" th:if="${param.error}">
        Неверный логин или пароль.
    </div>

    <form th:action="@{/login}" method="post">
        <label for="username">Логин</label>
        <input type="text" id="username" name="username" placeholder="user1" autofocus required/>

        <label for="password">Пароль</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required/>

        <button type="submit">Войти</button>
    </form>

    <p class="hint">Тестовые пользователи: user1 / user1pass, user2 / user2pass</p>
</div>
</body>
</html>
