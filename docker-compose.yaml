services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.2
    container_name: my-market-keycloak
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      TZ: Europe/Berlin
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: "8180"
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_HTTP_ENABLED: "true"
    ports:
      - "8180:8180"
    volumes:
      - ./keycloak:/opt/keycloak/data/import
    healthcheck:
      test: [ "CMD-SHELL", "exec 3<>/dev/tcp/localhost/8180 && echo -e 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && cat <&3 | grep -q '200 OK'" ]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

  postgres:
    image: postgres:16
    container_name: my-market-postgres16
    restart: unless-stopped
    environment:
      POSTGRES_DB: my-market-app
      POSTGRES_USER: my_market_user
      POSTGRES_PASSWORD: my_market_pass
      TZ: Europe/Berlin
    ports:
      - "5432:5432"
    volumes:
      - pg16_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U my_market_user -d \"my-market-app\" || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: my-market-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  payments:
    build:
      context: .
      dockerfile: payments/Dockerfile
    container_name: my-market-payments
    restart: unless-stopped
    environment:
      TZ: Europe/Berlin
      SERVER_PORT: "8081"
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/api/payments/balance || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  storefront:
    build:
      context: .
      dockerfile: storefront/Dockerfile
    container_name: my-market-storefront
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      payments:
        condition: service_healthy
    environment:
      TZ: Europe/Berlin
      SERVER_PORT: "8080"

      SPRING_R2DBC_URL: r2dbc:postgresql://postgres:5432/my-market-app
      SPRING_R2DBC_USERNAME: my_market_user
      SPRING_R2DBC_PASSWORD: my_market_pass

      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/my-market-app
      SPRING_DATASOURCE_USERNAME: my_market_user
      SPRING_DATASOURCE_PASSWORD: my_market_pass
      SPRING_LIQUIBASE_ENABLED: "true"

      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"

      PAYMENTS_BASE_URL: http://payments:8081
    ports:
      - "8080:8080"

volumes:
  pg16_data:
  keycloak_data:
